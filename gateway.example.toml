bind_address = "0.0.0.0"
# Gateway port (defaults to 80)
port = 80

# Gateway mode:
# - "serve" (default): reply to gateway packets locally and return [[servers]] list.
# - "proxy": act as a transparent TCP proxy to proxy_remote.
# mode = "serve"
# proxy_remote = "127.0.0.1:80"
# proxy_dial_timeout_ms = 5000
# require_private_clients = true

[updates]
# Follow the official game's updates while running: every interval, re-read the
# client version and resource hashes from the official gateway of the EN region
# and versions.json from the data source.
# enabled = true
# Minutes between checks; 0 checks once at startup only.
# interval_minutes = 60
# Where game data and versions.json are downloaded from (raw GitHub URL of a
# belfast-data style repository, "https://raw.githubusercontent.com/<owner>/<repo>/<branch>").
# data_base_url = "https://raw.githubusercontent.com/ggmolly/belfast-data/main"

[[servers]]
# Server list entries (used by gateway).
id = 1
# Optional display name returned in server list packets.
# name = "Belfast"
ip = "127.0.0.1"
port = 7000
# Legacy field kept for backward compatibility; gateway status probing ignores api_port.
api_port = 2289
# When true, mark this server online without protocol probing.
# assert_online = true
# proxy_ip = "127.0.0.1"
# proxy_port = 7001
